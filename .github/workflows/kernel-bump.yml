# Weekly: if kernel.org has a newer point release of our LTS series, build it and open a PR.
# shortcut: builds only; GitHub's macOS runners can't run Virtualization.framework guests, so the
# boot + leak probes (plan §9) run locally on the PR until a self-hosted Mac runner exists.
name: Kernel bump
on:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:
permissions: { contents: write, pull-requests: write, issues: write }
jobs:
  bump:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: v
        run: |
          cur=$(cat kernel/VERSION)
          new=$(curl -sf https://www.kernel.org/releases.json | jq -r --arg s "${cur%.*}." \
            '[.releases[] | select(.version | startswith($s)) | .version][0] // empty')
          echo "cur=$cur" >> "$GITHUB_OUTPUT"
          [ -n "$new" ] && [ "$new" != "$cur" ] && echo "new=$new" >> "$GITHUB_OUTPUT" || echo "up to date ($cur)"
      - if: steps.v.outputs.new
        run: |
          new=${{ steps.v.outputs.new }}
          echo "$new" > kernel/VERSION
          # kernel.org's checksum list, signed by the stable maintainers; the reviewer checks it against the signature.
          curl -sf https://cdn.kernel.org/pub/linux/kernel/v${new%%.*}.x/sha256sums.asc | awk -v f="linux-$new.tar.xz" '$2 == f { print $1 }' > kernel/SHA256
          [ -s kernel/SHA256 ]
          Scripts/build-kernel.sh
          b=kernel-${{ steps.v.outputs.new }}
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git switch -c "$b" && git commit -am "Bump the guest kernel to ${{ steps.v.outputs.new }}" && git push -u origin "$b"
          body="Built in CI. Before merging, check kernel/SHA256 against kernel.org's signed sha256sums.asc, boot it and run the leak probes on a Mac."
          # Repos that don't let Actions open PRs (the 6.18.60 failure, review S6.2) get an issue instead.
          gh pr create --fill --body "$body" || gh issue create --title "Kernel $new is ready on branch $b" --body "$body Open a PR from \`$b\`."
        env:
          GH_TOKEN: ${{ github.token }}

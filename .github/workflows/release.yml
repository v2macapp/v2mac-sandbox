# Push a tag vX.Y.Z: builds agent, kernel and rootfs on arm64 Linux, the base plugins build on (that
# rootfs as an image, pushed to GHCR; its digest becomes the helper's bases.json), then the helper on
# macOS, and publishes the bundle file by file with its manifest files.json, bsdiff patches of the rootfs
# from the last 3 releases (docs/delta-updates.md) and the signed pin.json, which every V2Mac with the same link version
# picks up from releases/latest.
name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: write, packages: write }
jobs:
  bases:
    needs: image
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image, path: out }
      - run: Scripts/build-base.sh
      - name: Push to GHCR and list the digest plugins may build FROM
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo=ghcr.io/v2macapp/v2mac-base
          ref=$repo:${{ github.ref_name }}
          docker tag v2mac/base "$ref" && docker push "$ref"
          # The image also has local RepoDigests; select the one just pushed to GHCR.
          digest=$(docker image inspect --format '{{json .RepoDigests}}' "$ref" | python3 -c 'import json,sys; print(next(d for d in json.load(sys.stdin) if d.startswith(sys.argv[1]+"@sha256:")))' "$repo")
          # Every released base stays allowed, or each release would hide the store's apps.
          gh release download -p bases.json -O out/images/last-bases.json || true
          Scripts/merge-bases.py "$digest" Resources/released-bases.json out/images/last-bases.json > out/images/bases.json
          cat out/images/bases.json
      - uses: actions/upload-artifact@v4
        with: { name: bases, path: out/images/bases.json }
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with: { path: sandbox }
      - id: app
        run: echo "ref=$(cat sandbox/app.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { repository: v2macapp/v2mac, ref: "${{ steps.app.outputs.ref }}", path: app }
      - run: sandbox/Scripts/build-agent.sh && sandbox/Scripts/build-kernel.sh && sandbox/Scripts/build-rootfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            sandbox/out/Image
            sandbox/out/rootfs.erofs
  patches:
    needs: image
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image, path: out }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bsdiff
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: Scripts/make-patches.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with: { name: patches, path: out/patches, if-no-files-found: ignore }
  helper:
    needs: [image, bases, patches]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with: { path: sandbox }
      - id: app
        run: echo "ref=$(cat sandbox/app.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { repository: v2macapp/v2mac, ref: "${{ steps.app.outputs.ref }}", path: app }
      - uses: actions/download-artifact@v4
        with: { name: image, path: sandbox/out }
      - uses: actions/download-artifact@v4
        with: { name: bases, path: sandbox/out/images }
      - uses: actions/download-artifact@v4
        continue-on-error: true # no earlier release, no patches
        with: { name: patches, path: sandbox/out/patches }
      - working-directory: sandbox
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # V2Mac trusts a sandbox release by this signature: without it, no copy would take the release.
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::The UPDATE_SIGNING_KEY secret is not set"; exit 1; }
          VERSION=${VERSION#v} Scripts/build-helper.sh
          Scripts/package.sh "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/files.json"
          ../app/Scripts/sign-update.swift out/pin.json
          gh release create "${{ github.ref_name }}" out/release/* out/pin.json out/pin.json.sig out/images/bases.json --title "${{ github.ref_name }}" --notes "Pin: \`$(cat out/pin.json)\`"
